<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover es lo que hace que env(safe-area-inset-*) valga algo en las
     pantallas con notch o barra de gestos, tanto en el navegador como al instalar
     la app como PWA o APK. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>SESP — Práctica Saber Pro</title>
<link rel="stylesheet" href="ui/styles.css">
</head>
<body>
<div id="app"></div>

<!-- Datos: bancos de preguntas reales + metadata de módulos -->
<script src="data/modules.js"></script>
<script src="data/questions.rc.js"></script>
<script src="data/questions.lc.js"></script>
<script src="data/questions.cc.js"></script>
<script src="data/questions.in.js"></script>
<script src="data/questions.ce.js"></script>
<script src="data/questions.fp.js"></script>
<script src="data/questions.ds.js"></script>
<script src="data/questions.pc.js"></script>

<!-- Banco de entrenamiento: NO oficial, generado para este proyecto. Vive aparte
     (window.SESP.data.questions.GEN) y solo lo usa el Modo Entrenamiento. -->
<script src="data/questions.gen.rc.js"></script>
<script src="data/questions.gen.lc.js"></script>
<script src="data/questions.gen.cc.js"></script>
<script src="data/questions.gen.in.js"></script>
<script src="data/questions.gen.ce.js"></script>

<!-- Explicaciones de las preguntas oficiales (análisis propio, no del ICFES). -->
<script src="data/explanations.js"></script>

<!-- Motor: sin UI, sin conocer el DOM -->
<script src="core/storage.js"></script>
<script src="core/engine.js"></script>
<script src="core/stats.js"></script>

<!-- Modos: unen datos + motor según la mecánica de cada uno -->
<script src="modes/practice.js"></script>
<script src="modes/review.js"></script>
<script src="modes/express.js"></script>
<script src="modes/simulation.js"></script>
<script src="modes/training.js"></script>

<!-- Interfaz -->
<script src="ui/app.js"></script>
</body>
</html>
