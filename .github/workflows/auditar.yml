name: Auditar bancos

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Auditoría de bancos
        run: node tools/auditar.js
      - name: Auditoría de interfaz
        run: node tools/auditar-ui.js
